# Builds standalone CLI executables with `bun build --compile`, smoke-tests
# each on its real OS, and (on release) signs and attaches them to the
# GitHub release.
#
# Cross-compiles all targets from one Linux runner: onnxruntime-node ships
# every platform's native libraries in one package, and the build script
# downloads the missing @napi-rs/canvas platform bindings from the registry.
name: CLI Binaries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/binary/**"
      - "src/cli/**"
      - ".github/workflows/cli-binaries.yml"
      - "bun.lock"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Keep in lockstep with ci.yml: the compiled binaries embed this
          # exact Bun runtime, so it must be a pinned stable release.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # pdfium.wasm is built here, not committed: LiteParse's patched pdfium
      # archive linked with emsdk 3.1.72 (scripts/pdfium/build.sh, pinned by sha256).
      - name: Cache pdfium build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ppu-ocria-nano-pdfium
          key: pdfium-${{ runner.os }}-${{ hashFiles('scripts/pdfium/*') }}

      - name: Build pdfium wasm
        run: bash scripts/pdfium/build.sh

      - name: Build binaries
        run: bun scripts/binary/build-binaries.ts --all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: .bin-build/ppu-ocria-nano-*
          if-no-files-found: error
          # .bin-build is a dot-directory; the action's default hidden-file
          # filter would silently match nothing.
          include-hidden-files: true
          # ~700 MB per run and the PR trigger fires on every src/cli change;
          # a week is plenty for review, releases re-upload to the release.
          retention-days: 7

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            suffix: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            suffix: ""
          - os: macos-latest
            target: darwin-arm64
            suffix: ""
          - os: windows-latest
            target: windows-x64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      # For tests/fixtures/pages (smoke input) and package.json (version check).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: binaries

      - name: Run the binaries against the page fixtures
        shell: bash
        run: |
          EXPECTED=$(grep -m1 '"version"' package.json | sed 's/.*: *"\([^"]*\)".*/\1/')

          BIN="./binaries/ppu-ocria-nano-${{ matrix.target }}${{ matrix.suffix }}"
          chmod +x "$BIN"

          ACTUAL=$("$BIN" --version)
          echo "$BIN version: $ACTUAL (expected $EXPECTED)"
          test "$ACTUAL" = "$EXPECTED"

          # Full OCR: downloads the OCRia-nano-1 files (about 31 MB) on first
          # run, then must read a known row off the table fixture.
          "$BIN" convert tests/fixtures/pages/table.png | grep -F "Fern Hollow"

          # PDF input: the pdfium wasm must be embedded, there is no node_modules.
          # TODO(pdf): the embedded wasm path is set in scripts/binary/build-binaries.ts
          # once src/pdf/ settles; this step needs no change unless the CLI flags do.
          "$BIN" convert tests/fixtures/pages/digital.pdf --format text | grep -F "Springs of the Eastern Ridge"

  attach:
    name: Sign and attach to release
    if: github.event_name == 'release'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: binaries

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # ~150-190 MB raw compresses to ~50 MB; users download the archive, so
      # the archive is what gets attested, signed, and uploaded.
      - name: Compress for distribution
        run: |
          mkdir -p dist
          for f in binaries/ppu-ocria-nano-*; do
            name=$(basename "$f")
            case "$name" in
              *.exe) (cd binaries && zip -q "../dist/${name%.exe}.zip" "$name") ;;
              # Artifact download drops the executable bit; restore it so the
              # extracted binary runs without a chmod.
              *)     chmod +x "$f" && tar czf "dist/$name.tar.gz" -C binaries "$name" ;;
            esac
          done
          ls -lh dist

      # SLSA build provenance, verifiable with:
      #   gh attestation verify <file> --repo PT-Perkasa-Pilar-Utama/ppu-ocria-nano
      # Runs before signing so the subject glob cannot match the
      # .sigstore.json bundles the signing step creates.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Keyless signing via OIDC, same scheme as the npm tarball in
      # publish.yml: one .sigstore.json bundle per archive.
      - name: Sign the archives (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/* --repo "${{ github.repository }}" --clobber
