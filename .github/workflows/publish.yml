# .github/workflows/publish.yml

name: Publish

on:
  release:
    types: [published]
  # Manual trigger for re-publishing (e.g. jsr fell behind npm). Runs against
  # the selected ref; the npm step skips versions already published and the
  # release-asset steps are skipped when there is no release context.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # npm provenance + jsr OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match ci.yml: unpinned Bun 1.3.x races on ONNX session
          # teardown in the parallel test runner ("Session already disposed").
          # Pinned: bun 1.2.23 on linux could hang opencv-js 5's Promise-based
          # runtime init when the node and web entries load in one process,
          # and 1.3.13 SIGILL'd on exit. 1.3.14 fixed both; 1.4.2 is the
          # current pin. Keep this in step with CONTRIBUTING.md and the serve
          # Dockerfile.
          bun-version: 1.4.2

      - name: Install dependencies
        # Frozen so install never rewrites bun.lock - a dirty tree makes the
        # `jsr publish` step below abort ("Aborting due to uncommitted changes").
        run: bun install --frozen-lockfile

      # pdfium.wasm is built here, not committed: LiteParse's patched pdfium
      # archive linked with emsdk 3.1.72 (scripts/pdfium/build.sh, pinned by sha256).
      - name: Cache pdfium build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ppu-ocria-nano-pdfium
          key: pdfium-${{ runner.os }}-${{ hashFiles('scripts/pdfium/*') }}

      - name: Build pdfium wasm
        run: bash scripts/pdfium/build.sh

      # The test step runs the whole repo, including apps/serve (a standalone
      # package with its own deps); install them first so they resolve.
      - name: Install serve dependencies
        run: cd apps/serve && bun install --frozen-lockfile

      # Block the release on any High/Critical advisory in a dependency.
      # Mirrors the SCA gate that runs on every PR in ci.yml.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      # Pinned bun 1.2.23 caps lifecycle-hook timeouts at the 5 s default, and
      # the web tests read the OCRia-nano-1 files straight from ~/.cache. Warm
      # the cache here so the in-hook downloads are fast disk hits - mirrors
      # ci.yml.
      - name: Warm model cache
        run: bun scripts/warm-test-models.ts

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Writes README + a sanitized package.json (no scripts/devDependencies)
      # into lib/ so the published package can run no install lifecycle code.
      - name: Prepare publish manifest
        run: bun task prepare-publish

      # Guard the bin before it ships: it must run and be in the tarball, or
      # `npx ppu-ocria-nano` breaks for everyone.
      - name: Verify CLI bin is runnable and packed
        run: |
          node lib/cli/index.js --version
          npm pack ./lib --dry-run 2>&1 | grep -q 'cli/index.js'

      # --provenance is auto-generated by OIDC trusted publishing, but passing
      # it explicitly makes a misconfigured publisher fail loudly instead of
      # silently shipping without an attestation.
      - name: Publish to npm
        run: |
          ver=$(node -p "require('./lib/package.json').version")
          if npm view "ppu-ocria-nano@$ver" version >/dev/null 2>&1; then
            echo "ppu-ocria-nano@$ver already published to npm, skipping."
          else
            npm publish ./lib --access=public --provenance
          fi

      # Generate a CycloneDX SBOM and attach it to the GitHub release so
      # consumers can audit each version's dependency set.
      - name: Generate and attach SBOM
        if: github.event_name == 'release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: ppu-ocria-nano-sbom.cyclonedx.json
          output-file: ppu-ocria-nano-sbom.cyclonedx.json
          upload-release-assets: true

      # Pack the exact published tarball so it can be signed and attached to the
      # GitHub release. OpenSSF Scorecard's Signed-Releases check reads release
      # assets for a signature/provenance file (npm provenance is not visible to
      # it), so we attach a cosign Sigstore bundle per release.
      - name: Pack published tarball
        if: github.event_name == 'release'
        run: npm pack ./lib --pack-destination "$RUNNER_TEMP"

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signing via OIDC (Sigstore/Fulcio) - no long-lived keys; uses the
      # id-token: write permission. cosign 3.x emits one .sigstore.json bundle
      # (signature + Fulcio cert + Rekor entry); Scorecard recognizes the suffix.
      - name: Sign the tarball (keyless)
        if: github.event_name == 'release'
        env:
          COSIGN_YES: "true"
        run: |
          for f in "$RUNNER_TEMP"/*.tgz; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json"
          done

      - name: Attach signed artifacts to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP"/*.tgz.sigstore.json \
            --repo "${{ github.repository }}" --clobber

      # JSR publishes an upload from its own queue: 5 minutes to over an hour on
      # 2026-10-20, while the CLI waits. It runs last, so npm and the signed
      # tarball never wait on it, and a re-run skips a version JSR already has.
      # --allow-dirty: the build and the SBOM leave untracked files behind;
      # jsr.json's include list decides what is published.
      - name: Publish package to jsr
        timeout-minutes: 30
        run: |
          ver=$(node -p "require('./jsr.json').version")
          if curl -fsS -o /dev/null "https://api.jsr.io/scopes/snowfluke/packages/ppu-ocria-nano/versions/$ver"; then
            echo "@snowfluke/ppu-ocria-nano@$ver already published to jsr, skipping."
          else
            bunx jsr publish --allow-dirty
          fi
